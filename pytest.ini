[pytest]
testpaths = backend/app/tests automation/api_tests automation/database_tests automation/integration_tests automation/security_tests automation/ui_tests
pythonpath = backend
addopts = -ra --strict-markers --timeout=120
markers =
    mongo: needs the local test MongoDB instances (ports 27117/27118)
    ui: Playwright browser tests (need running backend + frontend)
    slow: long-running tests
